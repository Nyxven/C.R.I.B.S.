name: DB migrate
# Manual only (Actions tab > Run workflow). Tables are applied by hand in Neon's SQL Editor,
# so this must not run on every push. Needs the secret DATABASE_URL_UNPOOLED in the "production" environment.
on:
  workflow_dispatch:
concurrency: db-migrate
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check secret
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: test -n "$DATABASE_URL_UNPOOLED" || { echo "Secret DATABASE_URL_UNPOOLED is empty. Add it under Settings > Environments > production."; exit 1; }
      - run: npx drizzle-kit migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
